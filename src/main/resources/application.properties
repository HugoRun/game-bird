server.port=80
server.servlet.session.cookie.name=sk_bird
server.servlet.session.timeout=60m

# ---- Session Cookie 安全属性 ----
# 【RT-6 安全项】改造前只设了 cookie.name 与 timeout。
# http-only 是 Spring Boot 的默认值(true)，此处【显式声明】以防未来版本默认值变化；
# same-site 改造前完全未设，浏览器各自取默认值，行为不确定。
# Lax 允许「从站外链接点进来」的正常导航携带 Cookie，同时阻断「跨站 POST 表单提交」
# 这一类 CSRF 攻击 —— 这是选 Lax 而非 Strict 的原因。
# 【为什么不加 secure】server.port=80 是明文 HTTP，开了 secure 浏览器在 http 下
# 就不会回传 Cookie，全站登录会失效。若将来上HTTPS，需同时改 server.port、
# server.forward-headers-strategy 并加 secure=true（见 README 已知问题）。
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.suffix=.html

spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ---- 数据库凭据外置 ----
# 原先 username/password 明文硬编码为 root/root。改为环境变量注入，
# 保留 :root 默认值是为了让本地开发免配置可用，生产必须由环境变量覆盖。
# docker/docker-compose.yml 已通过 SPRING_DATASOURCE_USERNAME /
# SPRING_DATASOURCE_PASSWORD 注入，变量名沿用 Spring Boot 的 relaxed binding，
# 无需改动；且环境变量优先级高于本文件的占位符默认值，两者不冲突。
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:game_bird}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2b8&allowMultiQueries=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

mybatis-plus.mapper-locations="classpath*:mapper/*.xml"

# ---- 游戏开关（映射到 config/GameProperties.java）----
# 注册开关。原为 ConstData.IS_ALLOW_REGISTER 这个 public static 字段，
# 任何代码都能在运行期改写；移到配置绑定后开关有唯一来源，且可用环境变量覆盖。
game.allow-register=${IS_ALLOW_REGISTER:true}

# 包裹总容量。原先 6 个包裹模板各写死一个 3000，改容量要动 6 个文件；
# 现在只有这一个来源。
# 【注意】本项只负责「下发到页面显示」，不参与任何校验 ——
# 当前版本没有任何地方真正限制玩家包裹上限（见 README 已知问题）。
game.pack-total-capacity=${PACK_TOTAL_CAPACITY:3000}


# ---- CORS 外置 ----
# 【为什么默认空】本项目是 Thymeleaf 服务端渲染单体，没有跨域调用需求。
# 之前硬编码 addAllowedOrigin("*") 等于对全网开放，是不必要的攻击面。
# 若将来真有跨域前端（如独立部署的管理台），在此显式列出允许的源（逗号分隔）即可。
game.cors.allowed-origins=
