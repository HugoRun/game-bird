<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>修改密码</title>
    <meta content="width=device-width,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <link href="../../static/css/bootstrap5.3.2.css" rel="stylesheet" th:href="@{/assets/css/bootstrap5.3.2.css}">
    <link href="../../static/css/style.css" rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>
<body>
<div class="main">
    <form action="" method="post">
        <h3>修改密码</h3>
        <div>
            <div class="mb-1">
                <div>旧密码:</div>
                <div><input name="oldPassword" type="password" autocomplete="current-password"/></div>
            </div>
            <div class="mb-2">
                <div>新密码:</div>
                <div><input name="password1" type="password" autocomplete="new-password"/></div>
            </div>
            <div class="mb-2">
                <div>确认新密码:</div>
                <div><input name="password2" type="password" autocomplete="new-password"/></div>
            </div>
            <div th:if="${message}">
                <div class="text-success text-end" th:if="${message.messageType.typeId == 2}" th:utext="${message.message}"></div>
                <div class="text-danger text-end" th:if="${message.messageType.typeId == 4}" th:utext="${message.message}"></div>
            </div>
            <div class="mb-1 text-end">
                <input class="btn btn-outline-primary" type="submit" value="保存">
            </div>
            <div class="text-end">
                <a href="/game.do">返回游戏</a>
            </div>
        </div>
    </form>
</div>
<script src="../../static/js/bootstrap.bundle.5.3.2.js" th:src="@{/assets/js/bootstrap.bundle.5.3.2.js}"></script>
</body>
</html>
