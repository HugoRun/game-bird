<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment/head::pageHead(title='修改密码')}"></head>
<body>

<div class="main">
    <div>
        <div class="pic">
            <img alt="" src="../../static/images/logo/pack.gif" th:src="@{/assets/images/logo/pack.gif}"/>
        </div>
        <div class="panel bg-blue">修改密码</div>
        <form th:action="@{/account/password}" method="post">
            <p><input type="password" name="oldPassword" placeholder="原密码" style="width:180px"></p>
            <p><input type="password" name="newPassword" placeholder="新密码（至少6位）" style="width:180px"></p>
            <p><input type="password" name="newPasswordRe" placeholder="重复新密码" style="width:180px"></p>
            <p>
                <input type="submit" value="确认修改">
                <a th:href="@{/game}">返回</a>
            </p>
        </form>
    </div>
    <div th:replace="~{fragment/navigation::navigation}"></div>
    <div th:replace="~{fragment/footDate::footDate}"></div>
</div>
</body>
</html>
