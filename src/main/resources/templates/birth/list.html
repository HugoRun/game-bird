<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment/head::pageHead(title='孵化场')}"></head>
<body>

<div class="main">
    <h2>孵化场</h2>
    <p th:if="${message}" th:text="${message}" class="text-muted"></p>

    <ul class="list1">
        <li th:each="b : ${births}">
            <div class="list1-info">
                <p th:text="'槽位 ' + ${b.idx}"></p>
                <p>小鸟配置ID: <span th:text="${b.birdBaseId}"></span></p>
                <p>孵化结束: <span th:text="${@gameUtils.getTimeDiff(b.birthEndTime, now)}"></span></p>
                <p class="btl">
                    <a href="#" th:if="${b.birthEndTime > 0 && b.birthEndTime <= now}"
                       th:href="@{/birth/collect(id=${b.id})}">领取成果</a>
                    <span th:if="${b.birthEndTime == 0 || b.birthEndTime > now}" class="text-muted">孵化中</span>
                </p>
            </div>
        </li>
    </ul>

    <div th:replace="~{fragment/navigation::navigation}"></div>
    <div th:replace="~{fragment/footDate::footDate}"></div>
</div>
</body>
</html>
