<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment/head::pageHead(title='小鸟情人')}"></head>
<body>

<div class="main">
    <div>
        <div th:replace="~{fragment/pack::packHeader(type='prop', label='道具', shopUrl='/shop/prop/items')}"></div>
        <div th:if="${page.getTotal() == 0}">
            <div th:replace="~{fragment/pack::packEmpty(label='道具', shopUrl='/shop/prop/items')}"></div>
        </div>
        <div th:if="${page.getTotal() > 0}">
            <ul class="list1">
                <li th:each="propVO, stat : ${page.getRecords()}">
                    <div class="list1-icon">
                        <img alt="" class="icon-gray-border" src="../../static/images/prop/1.gif" th:src="@{|/assets/images/prop/${propVO.baseId}.gif|}">
                    </div>
                    <div class="list1-info">
                        <p th:text="${stat.count + (page.current - 1) * page.getSize() }+'.'+${propVO.baseProp.name}+'×'+${propVO.getNum()}">谷子(25级)</p>
                        <p>功能:<span th:text="${propVO.baseProp.func}"></span></p>
                        <p>数量:<span th:text="${propVO.num}"></span></p>
                        <p class="btl">
                            <!-- 需要选择目标（小鸟/陷阱/训练槽/孵化槽）的道具跳目标选择页，其余直接使用 -->
                            <a th:if="${propVO.baseProp.effectType >= 8 && propVO.baseProp.effectType <= 10
                                        || (propVO.baseProp.effectType >= 15 && propVO.baseProp.effectType <= 19)}"
                               th:href="@{/pack/prop/target(packId=${propVO.id})}">选择目标使用</a>
                            <form th:if="!(${propVO.baseProp.effectType >= 8 && propVO.baseProp.effectType <= 10
                                        || (propVO.baseProp.effectType >= 15 && propVO.baseProp.effectType <= 19)})"
                                  th:action="@{/pack/prop/use}" method="post" style="display:inline">
                                <input type="hidden" name="packId" th:value="${propVO.id}">
                                <input type="submit" value="使用">
                            </form>
                    </div>
                </li>
            </ul>
            <div th:replace="~{fragment/pack::pagination}"></div>
        </div>
    </div>
    <div th:replace="~{fragment/navigation::navigation}"></div>
    <div th:replace="~{fragment/footDate::footDate}"></div>
</div>
</body>
</html>
