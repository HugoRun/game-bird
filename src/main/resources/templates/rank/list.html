<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment/head::pageHead(title='排行榜')}"></head>
<body>

<div class="main">
    <h2>🏆 排行榜</h2>
    <p>
        <a href="#" th:href="@{/rank/list(type='level')}">等级</a> |
        <a href="#" th:href="@{/rank/list(type='coin')}">金钱</a> |
        <a href="#" th:href="@{/rank/list(type='love')}">爱心</a> |
        <a href="#" th:href="@{/rank/list(type='bird')}">小鸟数</a>
    </p>

    <table class="list1">
        <thead>
        <tr>
            <th>名次</th>
            <th>角色</th>
            <th>等级</th>
            <th>金钱</th>
            <th>爱心值</th>
            <th>小鸟数</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r, stat : ${roles}"
            th:style="${r.roleId == session.sRole.roleId} ? 'background-color:#fff7d0' : ''">
            <td>
                <span th:if="${stat.count == 1}" class="text-darkorange">①</span>
                <span th:if="${stat.count == 2}" class="text-primary">②</span>
                <span th:if="${stat.count == 3}" class="text-primary">③</span>
                <span th:if="${stat.count > 3}" th:text="${stat.count}"></span>
            </td>
            <td>
                <span th:text="${r.roleName}"></span>
                <span th:if="${r.roleId == session.sRole.roleId}" class="text-darkorange">（我）</span>
            </td>
            <td th:text="${r.level + '级'}"></td>
            <td th:text="${r.coin}"></td>
            <td th:text="${r.lovePoint}"></td>
            <td th:text="${r.birdNum}"></td>
        </tr>
        </tbody>
    </table>

    <div th:replace="~{fragment/navigation::navigation}"></div>
    <div th:replace="~{fragment/footDate::footDate}"></div>
</div>
</body>
</html>
