<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>创建角色</title>
    <meta content="width=device-width,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <link href="../../static/css/bootstrap5.3.2.css" rel="stylesheet" th:href="@{/assets/css/bootstrap5.3.2.css}">
    <link href="../../static/css/style.css" rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>
<body>
<div class="main">
    <div class="avatar-wrapper"><img alt="头像" th:src="${session.sRole.avatarUrl}"><a href="./changeAvatar.html" th:href="@{/role/avatar}">设置头像</a></div>
    <div>姓名:<span>[[${session.sRole.roleName}]]</span><a href="./changeName.html" th:href="@{/role/name}"><span>设置</span></a></div>
    <div>性别:<span><span th:text="${@gameUtils.getSexName(session.sRole.sex)}"></span></span><a href="#" th:href="@{/role/sex}">设置</a></div>
    <div>称号:"<span th:text="${@gameUtils.getTitleName(session.sRole.titleId)}"></span>" <a href="#" th:href="@{/role/title}">设置</a></div>
    <div>等级:<span th:text="${session.sRole.level}"></span>级
        <span th:if="${session.sRole.totalExp != null}" class="text-muted"
              th:text="'(累计经验 ' + ${session.sRole.totalExp} + ')'"></span></div>
    <div>图鉴收集:<span class="text-primary" th:text="${collectedCount}"></span> 种 <a th:href="@{/storage/book}">查看图鉴</a></div>
    <div>战斗战绩:<span th:text="${fightWins}"></span>胜 / <span th:text="${fightTotal}"></span>场，胜率 <span th:text="${winRate}"></span>% <a th:href="@{/fight/list}">去战斗</a></div>
    <div>爱心:[[${session.sRole.lovePoint}]]</div>
    <div>现金:[[${session.sRole.coin}]]</div>
    <div>元宝:[[${session.sRole.diamond}]]</div>
    <div class="bg-blue"> 最佳宠物:</div>
    <div th:if="${bestBird != null}">
        <a th:href="@{/storage/bird(birdId=${bestBird.id})}">
            <span th:text="${bestBirdName}"></span>
        </a>
        <span th:text="${@gameUtils.getStarName(bestBird.star)}"></span>
        <span th:text="${#numbers.formatDecimal(bestBird.weight/100.0, 1, 2)} + '斤'"></span>
        <span class="text-muted" th:text="${bestBird.level + '级'}"></span>
    </div>
    <div th:if="${bestBird == null}" class="text-muted">暂无最佳宠物，去树林抓一只吧</div>
    <div class="qianlan"><span>心情短语:[[${session.sRole.dynamic}]]</span><a href="#" th:href="@{/role/dynamic}">更改</a></div>
    <div class="bg-blue"><a class="" th:href="@{/game}">返回游戏</a></div>
</div>
</body>
</html>
