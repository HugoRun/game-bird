<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment/head::pageHead(title='个人中心')}"></head>
<body>

<div class="main" th:with="nextLevel=${@gameConfigGateway.getBaseLevel(session.sRole.level + 1)},
                            needExp=${nextLevel != null ? nextLevel.totalExp : null},
                            pct=${needExp != null && needExp > session.sRole.totalExp ? session.sRole.totalExp * 100 / needExp : 100}">
    <!-- 角色卡头部 -->
    <div class="panel bg-blue profile-hero">
        <div class="avatar-wrapper">
            <img alt="头像" th:src="${session.sRole.avatarUrl}">
        </div>
        <div class="profile-hero-info">
            <div class="profile-name">
                <span th:text="${session.sRole.roleName}"></span>
                <span class="badge badge-fight" th:text="${@gameUtils.getTitleName(session.sRole.titleId)}"></span>
                <img alt="VIP" class="vip-icon" src="../../static/images/vip/vip_3.png"
                     th:src="|/assets/images/vip/vip_${session.sRole.vip}.png|">
            </div>
            <div class="profile-sub">
                <span th:text="${@gameUtils.getSexName(session.sRole.sex)}"></span> ·
                <span th:text="${session.sRole.level + ' 级'}"></span>
                <span th:if="${session.sRole.marriageType != null && session.sRole.marriageType > 0}" class="text-love">已婚</span>
            </div>
            <!-- 经验进度条 -->
            <div class="book-progress">
                <div class="book-progress-bar" th:style="|width:${pct}%|"></div>
            </div>
            <div class="text-muted profile-exp-line">
                距下一级还差
                <span th:text="${needExp != null ? needExp - session.sRole.totalExp : 0}"></span> 经验
            </div>
        </div>
    </div>

    <!-- 资产面板 -->
    <div class="panel bg-yellow">
        <div class="asset-grid">
            <div class="asset-cell"><div class="asset-num" th:text="${session.sRole.coin}"></div><div class="asset-key">💰 金币</div></div>
            <div class="asset-cell"><div class="asset-num" th:text="${session.sRole.diamond}"></div><div class="asset-key">💎 钻石</div></div>
            <div class="asset-cell"><div class="asset-num" th:text="${session.sRole.lovePoint}"></div><div class="asset-key">❤️ 爱心</div></div>
            <div class="asset-cell"><div class="asset-num" th:text="${session.sRole.bankCoin}"></div><div class="asset-key">🏦 存款</div></div>
        </div>
        <div class="text-end"><a th:href="@{/bank}">去银行存取 →</a></div>
    </div>

    <!-- 成就统计 -->
    <div class="panel bg-green">
        <div class="stat-row">
            <span class="stat-key">📖 图鉴收集</span>
            <span class="stat-val"><span th:text="${collectedCount}"></span> 种 <a class="stat-help" th:href="@{/storage/book}">查看图鉴</a></span>
        </div>
        <div class="stat-row">
            <span class="stat-key">⚔️ 战斗战绩</span>
            <span class="stat-val">
                <span th:text="${fightWins + ' 胜 / ' + fightTotal + ' 场（' + winRate + '%）'}"></span>
                <a class="stat-help" th:href="@{/fight/list}">去战斗</a>
            </span>
        </div>
        <div class="stat-row">
            <span class="stat-key">🏆 最佳宠物</span>
            <span class="stat-val" th:if="${bestBird != null}">
                <a th:href="@{/storage/bird(birdId=${bestBird.id})}" th:text="${bestBirdName}"></a>
                <span class="text-muted"
                      th:text="${@gameUtils.getStarName(bestBird.star) + ' ' + bestBird.level + '级 ' + #numbers.formatDecimal(bestBird.weight/100.0, 1, 2) + '斤'}"></span>
            </span>
            <span class="stat-val text-muted" th:if="${bestBird == null}">暂无，去树林抓一只吧</span>
        </div>
    </div>

    <!-- 心情与设置 -->
    <div class="panel">
        <div class="qianlan">
            💭 <span th:text="${session.sRole.dynamic == null || session.sRole.dynamic.isEmpty() ? '这只玩家很懒，什么都没写' : session.sRole.dynamic}"></span>
        </div>
        <div class="profile-actions">
            <a th:href="@{/role/avatar}">🖼️ 头像</a>
            <a th:href="@{/role/title}">🎖️ 称号</a>
            <a th:href="@{/role/name}">✏️ 昵称</a>
            <a th:href="@{/role/sex}">⚧ 性别</a>
            <a th:href="@{/role/dynamic}">💭 心情</a>
            <a th:href="@{/account/password}">🔑 改密</a>
        </div>
    </div>

    <div class="panel bg-blue"><a th:href="@{/game}">🏠 返回游戏</a></div>
</div>
</body>
</html>
