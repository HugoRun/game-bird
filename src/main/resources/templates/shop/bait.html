<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment/head::pageHead(title='小鸟情人')}"></head>
<body>
<div class="main">
    <div>
        <div th:replace="~{fragment/shop::shopHeader(type='bait')}"></div>
        <div th:if="${page.getTotal() == 0}">
            <div th:replace="~{fragment/shop::shopEmpty}"></div>
        </div>
        <div th:if="${page.getTotal() > 0}">
            <ul class="list1">
                <li th:each="baseBait, stat : ${page.getRecords()}"
                        th:classappend="${baseBait.lu > session.sRole.level} ? 'shop-locked' : ''">
                    <div class="list1-icon">
                        <img alt="" th:classappend="${baseBait.lu > session.sRole.level} ? 'shop-locked-img' : ''"  src="../../static/images/bait/1.gif" th:src="@{|/assets/images/bait/${baseBait.id}.gif|}">
                    </div>
                    <div class="list1-info">
                        <p><a th:href="@{|/shop/bait/detail(id=${baseBait.id})|}"><span th:text="${stat.count + (page.current - 1) * page.getSize() }+'.'+${baseBait.name}">名称</span></a><span th:text="${'|' + baseBait.lu + '级'}"></span><span th:if="${baseBait.lu > session.sRole.level}" class="badge badge-lock">🔒 需${baseBait.lu}级</span></p></p>
                        <p>捕捉:<span th:text="${@gameUtils.getCatchBirdName(baseBait.getBirdSet())}"></span></p>
                        <p>价格:<span th:text="${baseBait.getFeePrice()}"></span><span th:text="${@gameUtils.getFeeTypeName(baseBait.getFeeType())}"></span></p>
                        <div class="btl">
                            <th:block th:if="${baseBait.lu <= session.sRole.level}"><form class="inline-block" method="post" th:action="@{/shop/bait/purchase}">
                                <input name="id" th:value="${baseBait.id}" type="hidden">
                                购买:<input class="mini-input" maxlength="3" name="payNum" th:value="1" type="text">份 <input class="mini-button" th:value="确定购买" type="submit"/>
                                </form></th:block>
                            </form>
                        </div>

                    </div>
                </li>
            </ul>
            <div th:replace="~{fragment/shop::pagination}"></div>
        </div>
    </div>
    <div th:replace="~{fragment/navigation::navigation}"></div>
    <div th:replace="~{fragment/footDate::footDate}"></div>
</div>
</body>
</html>
