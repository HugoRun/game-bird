<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment/head::pageHead(title='小鸟情人')}"></head>
<body>
<div class="main">
    <div>
        <div th:replace="~{fragment/shop::shopHeader(type='cage')}"></div>
        <div th:if="${page.getTotal() == 0}">
            <div th:replace="~{fragment/shop::shopEmpty}"></div>
        </div>
        <div th:if="${page.getTotal() > 0}">
            <ul class="list1">
                <li th:each="baseCage, stat : ${page.getRecords()}">
                    <div class="list1-icon">
                        <img alt="" class="icon-gray-border" src="../../static/images/cage/1.gif" th:src="@{|/assets/images/cage/${baseCage.id}.gif|}">
                    </div>
                    <div class="list1-info">
                        <p th:text="${stat.count + (page.current - 1) * page.getSize() }+'.'+${baseCage.name}+'|'+${baseCage.lu}+'级'">谷子(25级)</p>
                        <p>功能:<span th:text="${baseCage.func}"></span></p>
                        <p>价格:<span th:text="${baseCage.getFeePrice()}"></span><span th:text="${@gameUtils.getFeeTypeName(baseCage.getFeeType())}"></span></p>
                        <div class="btl">
                            <form class="inline-block" method="post" th:action="@{/shop/cage/purchase}">
                                <input name="id" th:value="${baseCage.id}" type="hidden">
                                购买:<input class="mini-input" maxlength="3" name="payNum" th:value="1" type="text">份 <input class="mini-button" th:value="确定购买" type="submit"/>
                            </form>
                        </div>
                    </div>
                </li>
            </ul>
            <div th:replace="~{fragment/shop::pagination}"></div>
        </div>
    </div>
    <div th:replace="~{fragment/navigation::navigation}"></div>
    <div th:replace="~{fragment/footDate::footDate}"></div>
</div>
</body>
</html>
