<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment/head::pageHead(title='小鸟详情')}"></head>
<body>

<div class="main">
    <div th:if="${bird != null}">
        <div class="panel bg-blue">
            <span th:text="${baseBird != null ? baseBird.name : '未知小鸟'}"></span> ·
            <span th:text="${@gameUtils.getStarName(bird.star)}"></span>
        </div>
        <div>
            <img alt="" class="icon-gray-border" src="../../static/images/bird/1.gif" th:src="@{|/assets/images/bird/${bird.birdId}.gif|}">
            <div th:text="${baseBird != null ? baseBird.descText : ''}"></div>
            <div>性别:<span th:text="${@gameUtils.getBirdSexName(bird.sex)}"></span>
                类型:<span th:text="${baseBird != null ? typeNames.get(baseBird.type == null ? 0 : baseBird.type.intValue()) : '未知'}"></span></div>
            <div>等级:<span th:text="${bird.level}"></span>级（升级还需 <span th:text="${bird.level * 100 - bird.exp}"></span> 经验）</div>
            <div>体重:<span th:text="${#numbers.formatDecimal(bird.weight/100.0, 1, 2)}"></span>斤
                （初始 <span th:text="${#numbers.formatDecimal(bird.initWeight/100.0, 1, 2)}"></span>）</div>
            <div>成长:<span th:text="${bird.grow / 100.0}"></span>%　克制:<span th:text="${bird.ko / 100.0}"></span>%</div>
            <div>身价:<span th:text="${baseBird != null ? baseBird.price * (bird.weight / 100) : 0}"></span>金币</div>
            <div th:if="${bird.isLock != null && bird.isLock != 0}" class="text-primary">训练/配对中（已锁定）</div>
            <p class="btl" th:if="${bird.isLock == null || bird.isLock == 0}">
                <a th:href="@{/storage/sellConfirm(birdId=${bird.id})}">出售</a>
                <a th:href="@{/storage/releaseConfirm(birdId=${bird.id})}">放生</a>
                <a th:href="@{/storage/deploy(birdId=${bird.id})}">设为出战</a>
            </p>
            <div><a th:href="@{/storage/list}">返回仓库</a>　<a th:href="@{/trap/birdInfo(birdId=${bird.birdId})}">图鉴资料</a></div>
        </div>
    </div>
    <div th:replace="~{fragment/navigation::navigation}"></div>
    <div th:replace="~{fragment/footDate::footDate}"></div>
</div>
</body>
</html>
