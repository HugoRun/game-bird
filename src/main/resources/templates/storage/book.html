<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment/head::pageHead(title='小鸟图鉴')}"></head>
<body>

<div class="main">
    <div class="panel bg-blue">
        📖 小鸟图鉴 · 已收集
        <span class="text-darkorange" th:text="${collectedCount}"></span> /
        <span th:text="${totalCount}"></span> 种
        <a th:href="@{/storage/list}">返回仓库</a>
    </div>
    <div class="panel bg-yellow">
        <div class="text-muted">收网、孵化、试管孵化都会收录新物种；放生与出售不影响图鉴。</div>
        <!-- 总进度条 -->
        <div class="book-progress">
            <div class="book-progress-bar" th:style="|width:${totalCount > 0 ? collectedCount * 100 / totalCount : 0}%|"></div>
        </div>
        <div class="text-muted">图鉴每收集满 10/30/60/100 种，可在<a th:href="@{/task/list}">任务中心</a>领取成就奖励。</div>
    </div>

    <!-- 按场景分组 -->
    <div th:each="group : ${groups}">
        <div class="panel bg-green book-scene-head">
            <span th:text="${group.key}"></span>
            <span class="text-muted">
                <span th:text="${#lists.size(group.value)}"></span> 种
            </span>
        </div>
        <div class="book-grid">
            <div th:each="b : ${group.value}"
                 th:classappend="${collected.contains(b.id)} ? 'book-tile got' : 'book-tile none'">
                <div class="book-tile-img">
                    <img alt="" src="../../static/images/bird/1.gif"
                         th:src="@{|/assets/images/bird/${b.id}.gif|}">
                </div>
                <div class="book-tile-name">
                    <span th:if="${collected.contains(b.id)}" th:text="${b.name}"></span>
                    <span th:if="${!collected.contains(b.id)}" class="text-muted">？？？</span>
                </div>
                <div class="book-tile-sub">
                    <span th:if="${collected.contains(b.id)}"
                          th:text="${b.minWeight / 100.0 + '~' + b.maxWeight / 100.0 + '斤'}"></span>
                    <span th:if="${!collected.contains(b.id)}" class="text-muted">未收集</span>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragment/navigation::navigation}"></div>
    <div th:replace="~{fragment/footDate::footDate}"></div>
</div>
</body>
</html>
