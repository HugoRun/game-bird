<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment/head::pageHead(title='任务中心')}"></head>
<body>

<div class="main">
    <h2>📋 任务中心</h2>
    <p th:if="${message}" th:text="${message}" class="text-muted"></p>

    <p class="text-muted">每日登录自动完成；捕捉小鸟、购买道具的任务在达成时自动点亮，记得回来领奖。</p>
    <p><a th:href="@{/quest/list}"><button type="button" class="btn btn-primary">奋进目标（主线剧情 + 每日任务）</button></a></p>

    <table class="list1">
        <thead>
        <tr>
            <th>类型/说明</th>
            <th>状态</th>
            <th>奖励</th>
            <th>时间</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${tasks}">
            <td>
                <span th:class="${t.status == 1 ? 'text-primary' : ''}" th:text="${@gameUtils.getTaskTypeName(t.taskType)}"></span><br/>
                <span class="text-muted" th:text="${@gameUtils.getTaskTypeDesc(t.taskType)}"></span>
            </td>
            <td th:text="${t.status == 0 ? '进行中' : (t.status == 1 ? '可领取' : (t.status == 2 ? '已领取' : '未知'))}"></td>
            <td><span class="text-darkorange" th:text="${t.rewardCoin}"></span> 金币</td>
            <td>
                <span th:text="${@gameUtils.getTimeDiff(t.createTime, now) + '前创建'}"></span><br/>
                <span th:if="${t.finishTime != null && t.finishTime > 0}"
                      th:text="${@gameUtils.getTimeDiff(t.finishTime, now) + '前达成'}"></span>
                <span th:if="${t.finishTime == null || t.finishTime <= 0}" class="text-muted">未达成</span>
            </td>
            <td>
                <form th:if="${t.status == 1}" th:action="@{/task/claim}" method="post">
                    <input type="hidden" name="id" th:value="${t.id}"/>
                    <button type="submit">领取奖励</button>
                </form>
                <span th:if="${t.status == 0}" class="text-muted">去完成任务</span>
                <span th:if="${t.status == 2}" class="text-muted">已到账</span>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:replace="~{fragment/navigation::navigation}"></div>
    <div th:replace="~{fragment/footDate::footDate}"></div>
</div>
</body>
</html>
