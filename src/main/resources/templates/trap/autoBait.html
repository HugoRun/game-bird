<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment/head::pageHead(title='一键下饵')}"></head>
<body>

<div class="main">
    <div>
        <div class="pic">
            <img alt="" src="../../static/images/logo/pack.gif" th:src="@{/assets/images/logo/pack.gif}"/>
        </div>
        <div th:if="${baitList.size() == 0}">
            <div class="npc-pic"><img alt="球球" src="../../static/images/icon/npc.gif" th:src="@{/assets/images/icon/npc.gif}"/>球球:</div>
            <div class="npc-talk">
                <div>您还没有任何诱饵哦,马上去<a href="../../shop/bait.html" th:href="@{/shop/bait/items}">商店</a>购买吧！</div>
            </div>
        </div>
        <div th:if="${baitList.size() > 0}">
            <form th:action="@{/trap/autoUseBait}" method="post">
                <p class="text-muted">自动投入第一个空闲的陷阱槽。</p>
                <label style="margin:  10px 0;">
                    <select name="baitId">
                        <option th:each="baitVO, stat : ${baitList}" th:value="${baitVO.id}">
                            <th:block th:text="${baitVO.baseBait.name}+'×'+${baitVO.getNum()}">谷子(25级)</th:block>
                        </option>
                    </select>
                </label>
                <label style="display:block; margin: 10px 0;" th:if="${hasSticky}">
                    <input type="checkbox" name="useSticky" value="true"> 涂抹粘性道具（逃脱概率减半，消耗一张）
                </label>
                <input type="submit" th:value="一键下饵">
            </form>
        </div>
    </div>
    <div th:replace="~{fragment/navigation::navigation}"></div>
    <div th:replace="~{fragment/footDate::footDate}"></div>
</div>
</body>
</html>
